

model: "bedrock/qwen.qwen3-coder-next"
temperature: 0.0
aws_region_name: "us-east-1"

backend: "apptainer"
sif_image: "/path/to/scratch/images/dsgym_v4_runner.sif"
data_path: "data/data/dspredict-easy"
workspace_root: "/path/to/scratch/dsgym_v4_t_dataprm_fulltau"
csv_artifact_root: "/path/to/scratch/dsgym_v4_t_dataprm_fulltau_artifacts"

max_attempts: 5
max_iterations_per_attempt: 200
command_timeout: 600
max_command_timeout: 1800
task_timeout: 10800   # 3h — matches frozen xattempt; drives host watchdog + in-container budget (wedge fix)
condenser_max_size: 80
workers: 3

prm_feedback:
  enabled: false
prm_inline:
  enabled: false

prm_reviewer:
  enabled: true
  impl: "dataprm"
  history: "pull"                    # DataPRM reads the full turn-annotated tau file
  transcript_detail: "full"          # render reasoning, think text and file-edit contents
  max_turns: 100                     # unused by dataprm (native max_rounds=10 per step)
  time_budget_seconds: 3600
  command_timeout: 600
  inject_feedback: true
  inject_on_pass: false
  poll_timeout_seconds: 3900
  gate_finish_on_fail: true
  max_finish_refinements: 1
  cadence_turns: 10
  review_on_finish: true
  llm_kwargs:
    model: "dataprm"
    base_url: "http://localhost:19005/v1"
    api_key: "dummy"
