
model: "bedrock/qwen.qwen3-coder-next"
temperature: 0.0
aws_region_name: "us-east-1"

backend: "apptainer"
sif_image: "/path/to/scratch/images/dsgym_v4_runner.sif"
data_path: "data/data/dspredict-easy"
workspace_root: "/path/to/scratch/dsgym_v4_t_evolve_xattempt"
csv_artifact_root: "/path/to/scratch/dsgym_v4_t_evolve_xattempt_artifacts"

max_attempts: 5
max_iterations_per_attempt: 200
command_timeout: 600
max_command_timeout: 1800
task_timeout: 10800   # 3h — matches frozen xattempt; drives host watchdog + in-container budget (wedge fix)
condenser_max_size: 80
workers: 4

prm_feedback:
  enabled: false
prm_inline:
  enabled: false

prm_reviewer:
  enabled: true

  rubric_set: "discovered_xattempt"  # 19-rubric cross-attempt-aware variant of discovered
  operationalization: "dynamic"      # writes + runs bespoke check scripts (terminal ON)
  evolution: "evolving"              # add/update/retire_rubric tools ON  <-- AdaPRA delta
  history: "pull"                    # full tau exposed as a read-only file, read on demand

  max_turns: 100
  time_budget_seconds: 3600
  command_timeout: 600
  inject_feedback: true
  inject_on_pass: false
  poll_timeout_seconds: 3900
  gate_finish_on_fail: true
  max_finish_refinements: 1
  cadence_turns: 10
  review_on_finish: true
  min_importance: 0.5
  failure_threshold: 0.6
  llm_kwargs:
    model: "bedrock/us.anthropic.claude-sonnet-4-6"
    aws_region_name: "us-east-1"
