
model: "bedrock/qwen.qwen3-coder-next"
temperature: 0.0
aws_region_name: "us-east-1"

backend: "apptainer"
sif_image: "/path/to/scratch/images/dsgym_v4_runner.sif"
data_path: "data/data/dspredict-easy"
workspace_root: "/path/to/scratch/dsgym_v4_t_evolve_xattempt_c20_bo1"
csv_artifact_root: "/path/to/scratch/dsgym_v4_t_evolve_xattempt_c20_bo1_artifacts"

max_attempts: 1
max_iterations_per_attempt: 200
command_timeout: 600
max_command_timeout: 1800
task_timeout: 10800
condenser_max_size: 80
workers: 4

prm_feedback:
  enabled: false
prm_inline:
  enabled: false

prm_reviewer:
  enabled: true

  rubric_set: "discovered_xattempt"
  operationalization: "dynamic"
  evolution: "evolving"
  history: "pull"

  max_turns: 100
  time_budget_seconds: 3600
  command_timeout: 600
  inject_feedback: true
  inject_on_pass: false
  poll_timeout_seconds: 3900
  gate_finish_on_fail: true
  max_finish_refinements: 1
  cadence_turns: 20                  # <-- ABLATION DELTA: 10 -> 20
  review_on_finish: true
  min_importance: 0.5
  failure_threshold: 0.6
  llm_kwargs:
    model: "bedrock/us.anthropic.claude-sonnet-4-6"
    aws_region_name: "us-east-1"
